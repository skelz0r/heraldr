name: Heraldr

options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

packages:
  HeelerSSH:
    path: ../Vendor/Heeler/Packages/HeelerSSH

targets:
  Heraldr:
    type: application
    platform: iOS
    sources:
      - path: Heraldr
      - path: ../mac/dispatch.sh
        buildPhase: resources
      - path: ../mac/notify-hook.mjs
        buildPhase: resources
    dependencies:
      - package: HeelerSSH
      - target: HeraldrNotificationService
    postBuildScripts:
      - name: Stamp build version
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          set -e
          plist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          commit=$(git -C "${SRCROOT}" rev-parse --short HEAD 2>/dev/null || echo "unknown")
          if [ -n "$(git -C "${SRCROOT}" status --porcelain 2>/dev/null)" ]; then
            commit="${commit}-dirty"
          fi
          date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          /usr/libexec/PlistBuddy -c "Set :HeraldrBuildCommit ${commit}" "$plist"
          /usr/libexec/PlistBuddy -c "Set :HeraldrBuildDate ${date}" "$plist"
    info:
      path: Heraldr/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en]
        HeraldrTeamID: $(DEVELOPMENT_TEAM)
        HeraldrBuildCommit: ""
        HeraldrBuildDate: ""
    entitlements:
      path: Heraldr/Heraldr.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HERALDR_BUNDLE_ID)
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -warn-long-function-bodies=300 -Xfrontend -warn-long-expression-type-checking=300"
        PRODUCT_NAME: Heraldr
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Heraldr
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "The camera scans the pairing QR code shown by herdr on the Mac."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "The microphone lets you dictate the requests sent to herdr agents."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Dictation is transcribed on the iPhone, without leaving the device."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "The local network is used to reach the Mac over SSH."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

  HeraldrNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: HeraldrNotificationService
      - path: Heraldr/Push/QuestionReply.swift
    info:
      path: HeraldrNotificationService/Info.plist
      properties:
        CFBundleDisplayName: Heraldr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HERALDR_BUNDLE_ID).notification-service
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES

  HeraldrTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HeraldrTests
      - path: ../Vendor/Heeler/plugin/test-vectors/pairing-code-v1.json
        buildPhase: resources
      - path: ../mac/test/agent-names.tsv
        buildPhase: resources
      - path: ../mac/test/question-notification.json
        buildPhase: resources
    dependencies:
      - target: Heraldr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HERALDR_BUNDLE_ID).tests
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -warn-long-function-bodies=300 -Xfrontend -warn-long-expression-type-checking=300"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Heraldr.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Heraldr
        BUNDLE_LOADER: $(TEST_HOST)

  HeraldrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HeraldrUITests
    dependencies:
      - target: Heraldr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HERALDR_BUNDLE_ID).uitests
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -warn-long-function-bodies=300 -Xfrontend -warn-long-expression-type-checking=300"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Heraldr

schemes:
  Heraldr:
    build:
      targets:
        Heraldr: all
        HeraldrTests: [test]
        HeraldrUITests: [test]
    test:
      targets:
        - HeraldrTests
        - HeraldrUITests
