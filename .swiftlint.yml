included:
  - ios/Heraldr
  - ios/HeraldrTests
  - ios/HeraldrUITests

only_rules:
  - custom_rules
  - force_cast
  - force_try

force_try:
  severity: error

force_cast:
  severity: error

# Dictation.swift keeps the only three concurrency escape hatches:
# AVAudioConverter and AVAudioPCMBuffer are not Sendable, and the audio
# tap calls AudioFeeder on a single real-time thread; the input block of
# convert is called back synchronously on that thread.
custom_rules:
  unchecked_sendable:
    name: "@unchecked Sendable"
    regex: '@unchecked\s+Sendable'
    message: "Make the type truly Sendable (actor, value, Mutex) instead of silencing the compiler"
    severity: error
    excluded:
      - ios/Heraldr/Voice/Dictation.swift
  nonisolated_unsafe:
    name: "nonisolated(unsafe)"
    regex: 'nonisolated\(unsafe\)'
    message: "Isolate the state on an actor or make it Sendable instead of nonisolated(unsafe)"
    severity: error
    excluded:
      - ios/Heraldr/Voice/Dictation.swift
  preconcurrency:
    name: "@preconcurrency"
    regex: '@preconcurrency'
    message: "@preconcurrency hides Swift 6 concurrency errors: fix the isolation"
    severity: error
    excluded:
      - ios/Heraldr/Voice/Dictation.swift
  print_call:
    name: "print("
    regex: '(?<![\w.])print\('
    message: "No print( in the app: visible state goes through the UI, a diagnosis through a test"
    severity: error
  swiftlint_disable:
    name: "swiftlint:disable"
    regex: 'swiftlint:disable'
    message: "No exception in a comment: a justified exception goes in .swiftlint.yml"
    severity: error
  async_notification_delegate:
    name: "Async notification delegate"
    regex: 'func\s+userNotificationCenter\([^)]*\)\s+async'
    message: "Completion handler variant required: the async variant crashes on a tap while the app is not in the foreground (f4b5ff9)"
    severity: error
  sleep_without_cancellation_check:
    name: "Sleep without cancellation check"
    regex: '\n\s*try\?\s+await\s+Task\.sleep\([^\n]*\)\s*\n(?!\s*guard\s+!Task\.isCancelled)'
    message: "try? swallows cancellation: the rest runs anyway (notice cleared by a restarted .task(id:)). Follow with guard !Task.isCancelled else { return }"
    severity: error
