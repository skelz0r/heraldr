<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo concepts</title>
<style>
  :root { --radius: 22.37%; }
  body { margin: 0; font: 15px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; background: #F2F2F7; color: #1C1C1E; }
  h1 { font-size: 22px; margin: 24px 16px 8px; }
  p.lead { margin: 0 16px 24px; color: #6C6C70; }
  section { margin: 0 0 32px; }
  h2 { font-size: 17px; margin: 0 16px 8px; }
  .row { display: flex; flex-wrap: wrap; }
  .pane { flex: 1 1 420px; display: flex; align-items: flex-end; gap: 24px; padding: 24px 16px; }
  .light { background: #FFFFFF; }
  .dark { background: #000000; color: #EBEBF5; }
  .icon { display: block; border-radius: var(--radius); }
  .s180 { width: 180px; height: 180px; }
  .s60 { width: 60px; height: 60px; }
  .s1024 { width: 1024px; max-width: calc(100vw - 32px); height: auto; }
  details { margin: 0 16px; }
  summary { cursor: pointer; padding: 8px 0; color: #0A63D6; }
</style>
</head>
<body>
<h1>Propositions de logo</h1>
<p class="lead">Deuxième tour en tête, premier tour en fin de page. Chaque icône est montrée à 180 et 60 px sur fond clair et sombre, masque squircle iOS appliqué. Dépliez pour la taille 1024.</p>
<div id="list"></div>
<script>
  const icons = [
    ["voies-v2-a-epais.svg", "Voies v2 A. Épais (recommandé)"],
    ["voies-v2-a-epais-dark.svg", "Voies v2 A. Épais, apparence sombre"],
    ["voies-v2-a-epais-tinted.svg", "Voies v2 A. Épais, apparence teintée"],
    ["voies-v2-b-statuts.svg", "Voies v2 B. Statuts"],
    ["voies-v2-b-statuts-dark.svg", "Voies v2 B. Statuts, apparence sombre"],
    ["voies-v2-b-statuts-tinted.svg", "Voies v2 B. Statuts, apparence teintée"],
    ["voies-v2-c-clair.svg", "Voies v2 C. Clair"],
    ["voies-v2-d-quatre.svg", "Voies v2 D. Quatre voies"],
    ["voies-v2-e-verre.svg", "Voies v2 E. Verre"],
    ["eventail-v2-b-lames.svg", "Éventail v2 B. Lames (recommandé)"],
    ["eventail-v2-b-lames-dark.svg", "Éventail v2 B. Lames, apparence sombre"],
    ["eventail-v2-b-lames-tinted.svg", "Éventail v2 B. Lames, apparence teintée"],
    ["eventail-v2-a-comete.svg", "Éventail v2 A. Comète"],
    ["eventail-v2-a-comete-dark.svg", "Éventail v2 A. Comète, apparence sombre"],
    ["eventail-v2-a-comete-tinted.svg", "Éventail v2 A. Comète, apparence teintée"],
    ["eventail-v2-d-givre.svg", "Éventail v2 D. Givre"],
    ["eventail-v2-e-givre-lames.svg", "Éventail v2 E. Lames givrées"],
    ["eventail-v2-c-aube.svg", "Éventail v2 C. Aube"],
    ["1-eventail.svg", "Premier tour : 1. Éventail"],
    ["1-eventail-dark.svg", "Premier tour : 1. Éventail, apparence sombre"],
    ["1-eventail-tinted.svg", "Premier tour : 1. Éventail, apparence teintée"],
    ["5-voies.svg", "Premier tour : 5. Voix et voies"],
    ["5-voies-dark.svg", "Premier tour : 5. Voix et voies, apparence sombre"],
    ["5-voies-tinted.svg", "Premier tour : 5. Voix et voies, apparence teintée"],
    ["4-troupeau.svg", "Premier tour : 4. Troupeau"]
  ];
  const list = document.getElementById("list");
  for (const [file, label] of icons) {
    const pane = (theme) => `<div class="pane ${theme}"><img class="icon s180" src="${file}" alt=""><img class="icon s60" src="${file}" alt=""></div>`;
    list.insertAdjacentHTML("beforeend", `<section><h2>${label}</h2><div class="row">${pane("light")}${pane("dark")}</div><details><summary>1024 px</summary><img class="icon s1024" src="${file}" alt="${label}"></details></section>`);
  }
</script>
</body>
</html>
